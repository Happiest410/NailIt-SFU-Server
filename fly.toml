# fly.toml — Fly.io configuration for NailIt SFU Server
# Mediasoup requires UDP ports for WebRTC media transport

app = "nailit-sfu-server"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  UDP_SERVER_IP = "127.0.0.1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# Mediasoup WebRTC UDP ports (40000-40019)
# Each interview needs ~4 ports, so 20 ports = ~5 concurrent interviews
[[services]]
  protocol = "udp"
  internal_port = 40000
  [[services.ports]]
    port = 40000

